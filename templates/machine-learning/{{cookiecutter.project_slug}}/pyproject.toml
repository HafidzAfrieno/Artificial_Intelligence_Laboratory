[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "Machine Learning project"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "model/src"}

[tool.setuptools.packages.find]
where = ["model/src"]
