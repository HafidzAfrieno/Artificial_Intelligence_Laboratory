services:
  backend:
    build:
      context: ../backend
    container_name: "heart-disease-risk-classification-backend"
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: "heart-disease-risk-classification-frontend"
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend